[alembic]
script_location = migrations
prepend_sys_path = .
# The database URL is supplied via the DATABASE_URL environment variable
# (see openaid_poc.config); sqlAlchemy.url here is only a last-resort default.
sqlalchemy.url = postgresql+psycopg://openaid:openaid_dev_poc@127.0.0.1:5433/openaid_poc

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
