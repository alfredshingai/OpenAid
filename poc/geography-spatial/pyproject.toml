[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openaid-poc-geography-spatial"
version = "0.1.0"
description = "OpenAid proof of concept: country-configurable administrative hierarchies and PostGIS spatial data handling"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "OpenAid contributors" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "geoalchemy2>=0.15",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "geopandas>=1.0",
  "pyogrio>=0.9",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["openaid_poc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
